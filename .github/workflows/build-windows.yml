name: Build Windows installer

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run make
            - uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  path: out/make/**/*
